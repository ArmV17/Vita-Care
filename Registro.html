<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalCare</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
        <img src="img/Logo.png" width="75" class="Logo">
        <h1 class="Tittle">VitalCare</h1>
        <h2 class="subtittle">Monitorea la salud de tu paciente</h2>
      </div>

      <div class="col-md-6 d-flex justify-content-center">
        <div class="card log">
          <div class="volver-btn-container">
            <a href="index.html" class="btn btn-dark">
              <i class="bi bi-arrow-left-circle"></i> Volver
            </a>
          </div>
          <div class="card-body text-center">
            <h1 class="Log">Register</h1>

            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default">@ correo</span>
              <input type="email" class="form-control" aria-label="Correo" aria-describedby="inputGroup-sizing-default">
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default">Username</span>
              <input type="text" class="form-control" aria-label="Usuario" aria-describedby="inputGroup-sizing-default">
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default">Password</span>
              <input type="password" class="form-control" aria-label="Contraseña" aria-describedby="inputGroup-sizing-default">
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default">Confirmar</span>
              <input type="password" class="form-control" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" aria-describedby="inputGroup-sizing-default">
            </div>

            <div class="mb-3">
              <label class="me-3">
                <input type="radio" name="tipoUsuario" value="profesional"> Profesional
              </label>
              <label>
                <input type="radio" name="tipoUsuario" value="cuidador"> Cuidador
              </label>
            </div>

            <!-- Botón que redirige usando JavaScript -->
            <button type="button" class="btn btn-outline-primary" id="registerBtn">Registrar</button>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script para funcionalidad del botón -->
  <script>
    document.getElementById("registerBtn").addEventListener("click", function () {
      // Puedes cambiar la URL de redirección según tu necesidad
      window.location.href = "index.html";
    });
  </script>

  <!-- Bootstrap JS (opcional, solo si usas componentes que lo necesiten) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
