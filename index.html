<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <title>VitalCare</title>
</head>
<body>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
        <img src="img/Logo.png" width="75" class="Logo" />
        <h1 class="Tittle">VitalCare</h1>
        <h2 class="subtittle">Monitorea la salud de tu paciente</h2>
      </div>

      <div class="col-md-6 d-flex justify-content-center">
        <div class="card log text-center">
          <div class="card-body">
            <h1 class="Log">Login</h1>
            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default"
                >Username</span
              >
              <input
                type="text"
                class="form-control"
                id="username"
                aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default"
              />
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text" id="inputGroup-sizing-default"
                >Password</span
              >
              <input
                type="password"
                class="form-control"
                id="password"
                aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default"
              />
            </div>
            <button type="button" class="btn btn-outline-custom" id="loginBtn">Entrar</button>
            <div>
              <a class="link" href="Registro.html">Registro</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript para manejar el botón -->
  <script>
    document.getElementById("loginBtn").addEventListener("click", function () {
      // Aquí puedes agregar validación si es necesario
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username && password) {
        window.location.href = "Menu.html";
      } else {
        alert("Por favor completa todos los campos.");
      }
    });
  </script>
</body>
</html>
